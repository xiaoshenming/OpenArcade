<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>星点节拍</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#edf1fa;color:#242a36}
    body{display:grid;place-items:center}.stage{position:relative;width:100%;height:100%;min-height:360px;overflow:hidden;background:#edf1fa}
    .grid{position:absolute;inset:0;opacity:.4;background-image:linear-gradient(#d9deeb 1px,transparent 1px),linear-gradient(90deg,#d9deeb 1px,transparent 1px);background-size:48px 48px}
    .hud{position:absolute;z-index:3;top:16px;left:18px;right:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;color:#697284;font-size:9px;font-weight:750}.hud span{padding:7px 8px;border:1px solid #d8dde8;border-radius:8px;text-align:center;background:rgba(255,255,255,.9)}.hud strong{display:block;margin-top:2px;font-size:15px;color:#242a36;font-variant-numeric:tabular-nums}
    .target{position:absolute;z-index:2;width:72px;height:72px;padding:0;border:3px solid #fff;border-radius:50%;background:#ef5f78;box-shadow:0 0 0 8px rgba(239,95,120,.16),0 16px 34px rgba(144,52,75,.24);cursor:pointer;animation:pulse .75s infinite alternate}.target[hidden]{display:none}.target:after{content:'';position:absolute;inset:32%;border-radius:50%;background:#fff}
    .message{position:absolute;inset:0;z-index:4;display:grid;place-items:center;text-align:center;background:rgba(237,241,250,.9);backdrop-filter:blur(8px)}.message[hidden]{display:none}.message strong{display:block;font-size:34px}.message span{display:block;margin-top:9px;color:#697284}
    @keyframes pulse{to{transform:scale(.88);box-shadow:0 0 0 14px rgba(239,95,120,.08),0 20px 40px rgba(144,52,75,.28)}}
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="grid"></div>
    <div class="hud"><span>LEVEL<strong id="level">01</strong></span><span>TIME<strong id="time">20</strong></span><span>HITS<strong id="quota">0/5</strong></span><span>SCORE<strong id="score">0000</strong></span></div>
    <button class="target" id="target" aria-label="击中星点" hidden></button>
    <div class="message" id="message" hidden><div><strong>本轮结束</strong><span>点击主站重试按钮继续</span></div></div>
  </main>
  <script src="/sdk/openarcade-v1.js"></script>
  <script src="/games/orbit-tap/levels.js"></script>
  <script src="/games/orbit-tap/app.js"></script>
</body>
</html>
